<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altra</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f8ff;
      color: #123b8f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 700px;
      padding: 40px 20px;
    }

    .logo {
      font-size: 52px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .tagline {
      font-size: 20px;
      color: #333;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      padding: 14px 30px;
      background: #174ea6;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-size: 17px;
    }

    .button:hover {
      background: #0d3b82;
    }

    footer {
      margin-top: 50px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="logo">Altra</div>

    <div class="tagline">
      Smart solutions for a better digital future.
    </div>

    <a href="#" class="button">Get Started</a>

    <footer>
      ©️ 2026 Altra. All rights reserved.
    </footer>
  </div>

</body>
</html>
